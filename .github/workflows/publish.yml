name: Publish

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      move_latest_to:
        description: SHA the floating latest branch should point at
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string
      move_latest_to:
        description: SHA the floating latest branch should point at
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Build wheel and sdist
        run: uv build
      - name: Attach dist to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
      - name: Move latest
        if: ${{ inputs.move_latest_to != '' }}
        env:
          SHA: ${{ inputs.move_latest_to }}
        run: |
          git push -f origin "${SHA}:refs/heads/latest"
