name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: hk validate
        run: hk validate
      - name: hk check --all
        run: hk check --all

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-caching: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: pytest
        run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Build wheel and sdist
        run: uv build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: docs-check-dist
          path: dist/
